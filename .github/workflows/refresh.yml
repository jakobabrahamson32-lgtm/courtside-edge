
name: Refresh Courtside Edge Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: courtside-edge-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests nba_api nflreadpy pyarrow numpy

      - name: Refresh NBA and NFL data
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python refresh_all.py

      - name: Save pregame model history
        run: python model_history.py

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.csv'
          if ! git diff --cached --quiet; then
            git commit -m "Auto-refresh NBA and NFL data"
            git push
          fi
